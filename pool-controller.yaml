substitutions:
  device_name: davey-spa-controller
  friendly_name: Davey Spa Controller
  uart_rx_pin: GPIO16
  uart_tx_pin: GPIO17
  rs485_direction_pin: GPIO4

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  version: 3

external_components:
  - source: github://crestall/davey-esphome-spa-controller@main
    components:
      - pool_controller
    refresh: 0s

uart:
  id: pool_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

pool_controller:
  id: pool_interface
  uart_id: pool_bus
  direction_pin: ${rs485_direction_pin}

  pump_a:
    name: Pump A
    icon: mdi:pump

  pump_b:
    name: Pump B
    icon: mdi:pump

  heater_pump:
    name: Heater Pump
    icon: mdi:heat-pump

  blower_cycle:
    name: Blower Cycle
    icon: mdi:fan

  blower_state:
    name: Blower State
    icon: mdi:fan

  pool_temp:
    name: Pool Temp
    icon: mdi:pool-thermometer

  set_temp:
    name: Set Temp
    icon: mdi:thermometer-lines

  display_line_1:
    name: Display Line 1

  display_line_2:
    name: Display Line 2

  controller_time:
    name: Controller Time
    icon: mdi:clock-outline

  # Raw diagnostic dumps of undecoded controller frames (hex payload).
  cmd_25:
    name: Cmd 25
    icon: mdi:clock-digital
    entity_category: diagnostic
  cmd_28:
    name: Cmd 28
    icon: mdi:code-braces
    entity_category: diagnostic
  cmd_31:
    name: Cmd 31
    icon: mdi:code-braces
    entity_category: diagnostic
  cmd_32:
    name: Cmd 32
    icon: mdi:code-braces
    entity_category: diagnostic

  menu_up:
    name: Menu Up
    icon: mdi:menu-up
  menu_down:
    name: Menu Down
    icon: mdi:menu-down
  menu_select:
    name: Menu Select
    icon: mdi:menu
  light_intensity:
    name: Light Intensity
    icon: mdi:brightness-6
  light_mode:
    name: Light Mode
    icon: mdi:palette
