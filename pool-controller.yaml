substitutions:
  device_name: davey-spa-controller
  friendly_name: Davey Spa Controller
  uart_rx_pin: GPIO16
  uart_tx_pin: GPIO17
  rs485_direction_pin: GPIO4

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  version: 3

external_components:
  - source: github://crestall/davey-esphome-spa-controller@main
    components:
      - pool_controller
    refresh: 1h

uart:
  id: pool_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

pool_controller:
  id: pool_interface
  uart_id: pool_bus
  direction_pin: ${rs485_direction_pin}

  pump_a:
    name: Pump A
    icon: mdi:pump

  pump_b:
    name: Pump B
    icon: mdi:pump

  heater_pump:
    name: Heater Pump
    icon: mdi:heat-pump

  blower_cycle:
    name: Blower Cycle
    icon: mdi:fan

  blower_state:
    name: Blower State
    icon: mdi:fan
